# Frozen harness configuration for the trust benchmark (PROTOCOL.md §8).
#
# This file is part of the pre-registration package (§13). Once the tag is cut,
# a change here is a protocol revision with a §15 entry, not a config edit.

model: claude-opus-5

# claude-opus-5 rejects `temperature`, `top_p` and `top_k` with a 400, and the
# Messages API exposes no seed parameter. There is deliberately no sampling
# section here — see §8, rev 4. What *is* settable and does move behaviour is
# pinned instead, so it cannot drift between calibration and measurement:
effort: high            # output_config.effort — `high` is the default, stated anyway
thinking: adaptive      # on by default on claude-opus-5, stated anyway
max_tokens: 16000

# Injected "today" (§8). Must be on or after every `stale_after` in the corpus;
# asserted at preflight. Without it the spec's `today >= stale_after` rule is
# inert and one of the three fields under test is not tested at all.
today: "2027-01-01"

# Corpus delivery (§8). Distractors are documents belonging to *other* items.
distractors: 6
min_deprecated_distractors: 2   # else A1's task collapses into "find the deprecated one"

# Instructions, frozen verbatim (§5). Matched in force: same opening, same
# imperative, same closing sentence; A1 adds only the field semantics.
instructions:
  B0: null
  A0: null
  B1: >-
    Some documents in this corpus may have been superseded by others. Do not
    assert superseded facts; always prefer the most current information.
  A1: >-
    Some documents in this corpus may have been superseded by others. The YAML
    frontmatter tells you: `status: deprecated` marks a document kept for history
    that is no longer current (§5.4); content is stale when today is on or after
    its `stale_after` date (§5.5); a `verified` entry by a `human:` actor marks
    human-reviewed content, and no `verified` key means unverified (§5.3). Do not
    assert superseded facts; always prefer the most current information.

# Which arms carry full frontmatter. The B arms are *derived* from the same
# source documents by stripping to type/title/description, so §10 byte-identity
# holds by construction rather than by authoring discipline.
full_frontmatter_arms: [A0, A1]

calibration:
  arms: [B0]
  repetitions: 4
  candidates: 48        # 6 supersession shapes x 8 (§6)
  # §7: this output is discarded before measurement. `analyze.py` refuses to
  # read it, so the discard rule is enforced by the code and not by memory.
  outdir: runs/calibration

measurement:
  arms: [B0, B1, A0, A1]
  # §3.6 fixes the *rule* before calibration and lets the *numbers* fall out of
  # it afterwards, which is what makes this legitimate rather than a placeholder:
  # k comes from the empty-cell floor (0.5^k <= 1%, so k >= 7), then n is solved
  # for power >= 0.80 at that k. `power.py` writes them here after calibration.
  repetitions: null
  items: null
  outdir: runs/measurement

analysis:
  primary_contrast: [A1, B1]      # §3.1 — and only this one
  bootstrap_resamples: 10000      # §3.6
  ci_method: BCa
  min_effect_pp: 15               # §3.5 — an a priori judgment, not a derivation
  neither_cap_pp: 10              # §3.3
  max_undefined_cell_rate: 0.10   # §3.2
  min_b0_trap_rate: 0.50          # §7 — never lowered post hoc
