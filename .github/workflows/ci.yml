name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Validate plugin & marketplace manifests
        run: jq empty .claude-plugin/plugin.json .claude-plugin/marketplace.json

      - name: Unit tests — okf_validate internals
        run: uv run tests/test_okf_validate.py

      - name: Validate example bundle (strict)
        run: uv run skills/validate/scripts/okf_validate.py examples/sample-bundle --strict

      - name: Validate this repo's own .okf bundle (strict, dogfooding)
        run: uv run skills/validate/scripts/okf_validate.py .okf --strict

      - name: Self-test — success output survives a cp1252 console (Windows regression)
        run: |
          # The ✓/✗/— glyphs crashed both scripts on default Windows consoles
          # (cp1252) until the _force_utf8_stdio() fix; simulate that codepage.
          PYTHONIOENCODING=cp1252 uv run skills/validate/scripts/okf_validate.py examples/sample-bundle
          echo "ok: validate output survives cp1252"

      - name: Self-test — a non-conformant bundle must fail
        run: |
          tmp="$(mktemp -d)"
          printf 'no frontmatter\n' > "$tmp/bad.md"
          if uv run skills/validate/scripts/okf_validate.py "$tmp"; then
            echo "validator failed to reject a non-conformant bundle" >&2
            exit 1
          fi
          echo "ok: non-conformant bundle correctly rejected"

      - name: Self-test — a v0.1 bundle reads, fails --strict, and --migrate clears it
        run: |
          # The upgrade path end to end. A v0.1 bundle stays conformant (§11 does
          # not mention `timestamp` or `# Citations`), --strict refuses it as the
          # migration nudge, and --migrate must turn that refusal into a clean
          # pass — otherwise the nudge is a wall.
          tmp="$(mktemp -d)"
          printf -- '---\nokf_version: "0.1"\n---\n# Legacy\n\n* [c](c.md)\n' > "$tmp/index.md"
          cat > "$tmp/c.md" <<'MD'
          ---
          type: Reference
          title: Legacy concept
          description: Authored against OKF v0.1.
          tags: [legacy]
          timestamp: "2026-01-01T00:00:00Z"
          ---
          A claim backed by a source.

          # Citations

          [1] [Source](https://example.com)
          MD
          uv run skills/validate/scripts/okf_validate.py "$tmp" --json > "$tmp/out.json" || {
            echo "a v0.1 bundle must not fail the default (non-strict) run" >&2
            exit 1
          }
          grep -q '"conformant": true' "$tmp/out.json" || {
            echo "a v0.1 bundle must still be reported conformant" >&2
            exit 1
          }
          if uv run skills/validate/scripts/okf_validate.py "$tmp" --strict; then
            echo "--strict must fail an unmigrated v0.1 bundle" >&2
            exit 1
          fi
          uv run skills/validate/scripts/okf_validate.py "$tmp" --migrate --strict || {
            echo "--migrate must leave the bundle strict-clean" >&2
            exit 1
          }
          uv run skills/validate/scripts/okf_validate.py "$tmp" --migrate --json \
            | grep -q '"migrated": \[\]' || {
            echo "--migrate must be idempotent — a second run changed files" >&2
            exit 1
          }
          echo "ok: v0.1 reads, --strict refuses, --migrate clears it, twice is a no-op"

      - name: Self-test — --max-warnings gates between the default and --strict
        run: |
          # A bundle with exactly one warning: the default passes, --strict fails,
          # and --max-warnings picks the line between them.
          tmp="$(mktemp -d)"
          printf -- '---\ntype: Reference\ntitle: t\ndescription: d\ntags: [x]\n---\nbody\n' > "$tmp/c.md"
          uv run skills/validate/scripts/okf_validate.py "$tmp" --max-warnings 1 || {
            echo "--max-warnings 1 must tolerate one warning" >&2
            exit 1
          }
          if uv run skills/validate/scripts/okf_validate.py "$tmp" --max-warnings 0; then
            echo "--max-warnings 0 must refuse one warning" >&2
            exit 1
          fi
          echo "ok: --max-warnings gates as documented"

      - name: The committed GitHub Pages demos match the generator
        run: |
          # docs/*.html is generator output committed to the repo. Nothing checked
          # it, so both pages shipped for weeks without the DOMPurify sanitize fix
          # that had already landed in okf_visualize.py. `make docs` pins the exact
          # invocation; this asserts the committed files are what it produces.
          make docs
          git diff --exit-code -- docs/ || {
            echo "docs/ is stale — run 'make docs' and commit the result" >&2
            exit 1
          }
          echo "ok: the live demos match the generator"

      - name: Self-test — okf_init.py scaffold passes strict validation clean
        run: |
          # The scaffold is meant to be exemplary: every recommended frontmatter
          # field present, a valid ISO log heading, no cross-link rot. Zero
          # warnings is the bar, not just zero errors.
          tmp="$(mktemp -d)"
          uv run skills/okf/scripts/okf_init.py "$tmp/bundle" --title "CI Self-Test"
          uv run skills/validate/scripts/okf_validate.py "$tmp/bundle" --strict
          echo "ok: okf_init.py scaffold is strict-clean"

      - name: Self-test — script-breaking sequences in concept bodies are neutralized
        run: |
          # A concept body may legitimately contain </script> (ends the inline
          # data script early), <!--<script (arms the script-data double-escaped
          # state, where even the template's real closing tag stops working), or
          # the literal string __EDGES__ (a naive template substitution would
          # splice the edges JSON into the middle of a node body). None of these
          # may corrupt the generated page. Assertions are on outcomes, not on a
          # specific escaping strategy.
          tmp="$(mktemp -d)"
          cat > "$tmp/snippet.md" <<'MD'
          ---
          type: Reference
          title: Snippet with hostile-looking but benign content
          ---
          Example markup a doc might contain:

          ```html
          <script src="app.js"></script>REPRO_MARKER
          <!--<script>DOUBLE_ESCAPE_MARKER
          ```

          The template placeholder __EDGES__ SPLICE_MARKER must survive verbatim.
          MD
          uv run skills/visualize/scripts/okf_visualize.py "$tmp" -o "$tmp/viz.html"
          grep -qF 'REPRO_MARKER' "$tmp/viz.html" || {
            echo "concept body went missing from the output entirely" >&2
            exit 1
          }
          if grep -qF '</script>REPRO_MARKER' "$tmp/viz.html"; then
            echo "raw </script> from a concept body leaked into the inline data script" >&2
            exit 1
          fi
          if grep -qF '<!--<script>DOUBLE_ESCAPE_MARKER' "$tmp/viz.html"; then
            echo "raw <!--<script leaked (script-data double-escaped state hazard)" >&2
            exit 1
          fi
          grep -qF '__EDGES__ SPLICE_MARKER' "$tmp/viz.html" || {
            echo "literal __EDGES__ in a concept body was clobbered by template substitution" >&2
            exit 1
          }
          echo "ok: script-breaking sequences in concept bodies are neutralized"

      - name: Self-test — concept body markdown is sanitized before innerHTML (XSS)
        run: |
          # A concept body is untrusted content — it must never execute script
          # when rendered. Assertions are outcome-level: the DOMPurify hook is
          # wired into the page and it wraps the marked.parse(...) call, not on
          # a specific escaping strategy.
          tmp="$(mktemp -d)"
          cat > "$tmp/c.md" <<'MD'
          ---
          type: Reference
          title: XSS probe
          ---
          <img src=x onerror="document.title='pwned'">
          MD
          uv run skills/visualize/scripts/okf_visualize.py "$tmp" -o "$tmp/viz.html"
          grep -q "dompurify" "$tmp/viz.html" || {
            echo "DOMPurify is not loaded in the generated page" >&2
            exit 1
          }
          grep -qE 'DOMPurify\.sanitize\(marked\.parse\(' "$tmp/viz.html" || {
            echo "marked.parse(...) output is not wrapped in DOMPurify.sanitize(...)" >&2
            exit 1
          }
          echo "ok: concept body rendering is sanitized"

      - name: Self-test — scale guardrails (auto linear layout, --max-nodes cap)
        run: |
          # Force (cose) layout freezes the page on large bundles (~32 s at 2k
          # concepts, measured in Chrome), so above AUTO_COSE_MAX the default
          # must fall back to a linear layout, and --max-nodes must refuse
          # oversized bundles. Assertions are on outcomes: the note on stderr,
          # the layout baked into the page, and the cap's non-zero exit.
          tmp="$(mktemp -d)"
          python3 - "$tmp" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for i in range(1200):
              (root / f"c{i:04d}.md").write_text(
                  f"---\ntype: Reference\ntitle: c{i}\n---\n\nSee [next](c{(i + 1) % 1200:04d}.md).\n",
                  encoding="utf-8")
          PY
          uv run skills/visualize/scripts/okf_visualize.py "$tmp" -o "$tmp/viz.html" 2>"$tmp/err.txt"
          grep -q "using the linear 'concentric' layout" "$tmp/err.txt" || {
            echo "large bundle did not report the auto layout fallback" >&2
            exit 1
          }
          grep -qF "layout:{name:'concentric'" "$tmp/viz.html" || {
            echo "large bundle did not bake the linear fallback layout into the page" >&2
            exit 1
          }
          uv run skills/visualize/scripts/okf_visualize.py "$tmp" -o "$tmp/viz2.html" --layout cose
          grep -qF "layout:{name:'cose'" "$tmp/viz2.html" || {
            echo "explicit --layout cose was not honored" >&2
            exit 1
          }
          if uv run skills/visualize/scripts/okf_visualize.py "$tmp" -o "$tmp/viz3.html" --max-nodes 1000; then
            echo "--max-nodes failed to refuse an oversized bundle" >&2
            exit 1
          fi
          echo "ok: scale guardrails behave"

  action:
    # The composite action is a distribution surface, so it gets exercised rather
    # than assumed: the happy path, and a bundle that must fail the gate. Without
    # the failing case a broken action would look green by never failing at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The action validates this repo's own bundle
        uses: ./
        with:
          bundle: .okf
          strict: "true"

      - name: The action fails a non-conformant bundle
        id: bad
        continue-on-error: true
        uses: ./
        with:
          bundle: tests/fixtures/non-conformant

      - name: ...and that failure is what marks the step failed
        run: |
          [ "${{ steps.bad.outcome }}" = "failure" ] || {
            echo "the action passed a bundle with a missing \`type\`" >&2
            exit 1
          }
          echo "ok: the action gates as documented"

  validate-windows:
    # Real regression coverage for the cp1252 class of bug: a genuine Windows
    # console (not a simulated codepage on Linux) defaults to cp1252, which is
    # what originally crashed the ✓/✗/— glyphs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Unit tests — okf_validate internals
        run: uv run tests/test_okf_validate.py

      - name: Validate example bundle (strict, native cp1252 console)
        run: uv run skills/validate/scripts/okf_validate.py examples/sample-bundle --strict

  version-bump:
    # A PR that changes the shipped surface must bump the plugin version, so the
    # release workflow (release.yml) then cuts a release for it. Docs, .okf/,
    # tests and CI are exempt. Add the `skip-version-check` label to bypass.
    #
    # Always runs (no job-level `if`) so it can be a *required* status check: a
    # skipped job does not report success and would wedge a required check. The
    # non-PR and label-bypass cases are handled inside the step, exiting 0.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a version bump for shipped changes
        env:
          EVENT: ${{ github.event_name }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-version-check') }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull request; nothing to enforce."
            exit 0
          fi
          if [ "$SKIP" = "true" ]; then
            echo "skip-version-check label present; bypassing the gate."
            exit 0
          fi
          # paths whose contents ship to users and therefore need a release
          shipped='^(\.claude-plugin/|skills/|hooks/|templates/|action\.yml)'
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          if ! echo "$changed" | grep -qE "$shipped"; then
            echo "No shipped-surface files changed; version bump not required."
            exit 0
          fi
          base_v="$(git show "$BASE:.claude-plugin/plugin.json" | jq -r .version)"
          head_v="$(git show "$HEAD:.claude-plugin/plugin.json" | jq -r .version)"
          # pass only if head_v is strictly greater than base_v
          highest="$(printf '%s\n%s\n' "$base_v" "$head_v" | sort -V | tail -1)"
          if [ "$base_v" != "$head_v" ] && [ "$highest" = "$head_v" ]; then
            echo "Version bumped $base_v -> $head_v for shipped changes. OK."
            exit 0
          fi
          echo "::error::Shipped files changed but .claude-plugin/plugin.json is still $head_v — bump it (it auto-releases on merge), or add the 'skip-version-check' label if this genuinely ships nothing."
          echo "Changed shipped files:"
          echo "$changed" | grep -E "$shipped" | sed 's/^/  /'
          exit 1
