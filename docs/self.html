const NODES=[{"id": "components/okf_init", "type": "Tool", "title": "okf_init.py", "description": "Scaffolds a conformant starter bundle (index.md, log.md, a starter concept) in one shot.", "tags": ["python", "scaffold", "uv"], "group": "components", "sz": 28, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-27T00:00:00Z"}, "verified": [], "sources": [], "body": "# Overview\n\nThe init fast-path used by `produce` mode in the [okf skill](/skills/okf.md).\nGiven a target directory, it writes a root `index.md` (frontmatter carries only\n`okf_version`), a `log.md` with a creation entry under today's ISO date\nheading, and one starter concept (`getting-started.md`) with the full set of\nrecommended v0.2 frontmatter fields (`status` and `generated: {by, at}`, written\nby the `process:okf_init` actor). The scaffold is exemplary by construction \u2014 it\npasses [`okf_validate.py`](/components/validator.md) `--strict` with zero\nwarnings.\n\n# Flags\n\n| Flag | Effect |\n|------|--------|\n| `--title` | Bundle title (default: humanized target dir name). |\n| `--force` | Scaffold even if the target already has `.md` files. |\n\nRefuses (exit 1) rather than clobbering a directory that already has `.md`\nfiles, unless `--force` is given. Exit 2 on bad arguments (missing target,\ntarget exists and is not a directory)."}, {"id": "components/release-workflow", "type": "Tool", "title": "release.yml", "description": "GitHub Actions workflow that tags and publishes a release when the plugin version bumps.", "tags": ["ci", "release", "github-actions"], "group": "components", "sz": 27, "status": "stable", "stale_after": "", "generated": {"by": "agent:claude-opus-4-8", "at": "2026-08-03T10:00:36Z"}, "verified": [], "sources": [], "body": "# Overview\n\nThe workflow that makes releasing automatic instead of a remembered manual step\n(see the [auto-release decision](/decisions/auto-release.md)).\n\n# Trigger and behaviour\n\nRuns on push to `main` filtered to `paths: ['.claude-plugin/plugin.json']`, so\nonly a version change wakes it. It then:\n\n1. reads `version` from `.claude-plugin/plugin.json`;\n2. checks whether a `okf--v\u003cversion>` release already exists (`gh release view`);\n3. if not, creates it with `gh release create --generate-notes`, tagging the\n   pushed commit.\n\nIdempotent by construction: a version already released is a no-op, so re-runs and\nunrelated pushes do nothing. Needs only `contents: write` and the built-in\n`GITHUB_TOKEN`."}, {"id": "components/stop-hook", "type": "Tool", "title": "okf-stop-check.sh", "description": "Dormant Stop hook \u2014 a no-op unless a bundle opts in to enforced upkeep.", "tags": ["bash", "hook", "enforcement"], "group": "components", "sz": 36, "status": "stable", "stale_after": "", "generated": {"by": "agent:claude-fable-5", "at": "2026-08-02T12:18:55Z"}, "verified": [], "sources": [], "body": "# Overview\n\nThe plugin's only hook, registered via `hooks/hooks.json` on the `Stop` event.\nShips with every install but is **dormant by default** \u2014 see the\n[dormant hooks decision](/decisions/dormant-hooks.md) for why it exists and\nwhat it replaces.\n\n# The gate\n\n`hooks/okf-stop-check.sh` exits 0 (no-op) unless *every* one of these holds,\nchecked in order:\n\n1. it is not itself running inside a stop-hook loop (`stop_hook_active`).\n2. the user has not opted out: env `OKF_HOOK` is not `off`.\n3. `.okf/index.md` exists in the working tree.\n4. that file's **frontmatter** \u2014 between the first two `---` lines \u2014 contains\n   the literal line `upkeep: enforced`, the opt-in flag a bundle sets to ask\n   for enforcement. A mention elsewhere in the file does not count.\n5. the working tree is a git repo with **modified tracked files** \u2014 untracked\n   paths are ignored, since a brand-new file is not yet a documented asset.\n   (This is what keeps tooling dirs like `.claude/` or `.venv/` from\n   false-firing the hook.)\n6. `.okf/log.md` is not already among those changes (if it is, the bundle was\n   plausibly maintained this session, so the hook stays quiet).\n\nOnly when all six hold does it block, asking the agent to update the matching\nconcept and append a dated `log.md` entry before finishing.\n\n# Activation\n\nA bundle turns this on by adding `upkeep: enforced` to `.okf/index.md`'s\nfrontmatter. A user force-disables it regardless of bundle settings by\nsetting `OKF_HOOK=off` in their environment.\n\n# Known limits\n\n* Gate 5 counts any *tracked* modification, not just this session's \u2014 a tree\n  left dirty by earlier work triggers the nudge too; the block reason tells\n  the agent it may finish if no documented asset changed. The flip side of\n  ignoring untracked files: if the only change is a new untracked file that\n  ought to get a concept, the hook stays quiet \u2014 authoring new assets is the\n  maintain flow's job, not this backstop's.\n* Conversely, an uncommitted `.okf/log.md` left over from an earlier session\n  satisfies gate 6 and silences the hook until it is committed.\n* Paths resolve from the session's working directory: a bundle not at\n  `./.okf/` (monorepo subdirectory, session launched elsewhere) is never seen.\n* The loop guard greps the raw JSON for `\"stop_hook_active\": true` rather\n  than parsing it \u2014 deliberate, so a missing `jq` can never disable the guard\n  and re-block forever."}, {"id": "components/validator", "type": "Tool", "title": "okf_validate.py", "description": "Zero-config Python conformance checker and v0.1\u2192v0.2 migrator (PEP 723 / uv, PyYAML).", "tags": ["python", "validator", "uv"], "group": "components", "sz": 36, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-27T00:00:00Z"}, "verified": [], "sources": [], "body": "# Overview\n\nThe deterministic engine behind the [validate skill](/skills/validate.md). A\nsingle self-describing script (dependencies declared inline via PEP 723) that\nparses every non-reserved `.md` file and enforces the one hard rule of the\n[OKF v0.2 spec](/reference/okf-spec.md): parseable YAML frontmatter with a\nnon-empty `type`.\n\n# Checks beyond the hard rule\n\nAll soft, all warnings: `generated.by` present when `generated` is; every\n`verified` entry has an actor (a bare mapping counts as a one-element list);\n`status` is one of draft/stable/deprecated; `stale_after` and\n`sources[].last_modified` are absolute `YYYY-MM-DD` dates; `generated.at` and\n`verified[].at` are RFC 3339 (date-only tolerated); every `sources` entry has a\n`resource`; a `usage_count` is framed by a `usage_window`; every `[^label]`\nfootnote names a `sources[].id`; an `Attested Computation` declares a `runtime`\nand its path-valued `computation` / `executor.resource` / `attester.resource`\nresolve inside the bundle. Legacy `timestamp` and `# Citations` warn with their\nv0.2 replacement, per the [dual-read decision](/decisions/okf-v02-dual-read.md).\n\n# The actor check (\u00a77)\n\nDeliberately not a whitelist \u2014 the spec's own \u00a75.1 example uses\n`author: team:ga4-docs`, so the `\u003cprefix>:\u003cid>` family is open. What is caught is\nthe one failure that is silent: a near-miss of `human:`. `Human:dana` satisfies\nthe generic shape and looks well-formed, while \u00a75.3 keys trust tiers off that\nexact lowercase prefix and reads it as an agent. `humanoid_agent/v1` is not a\nnear-miss and passes.\n\n# Migration (`--migrate`)\n\nThe only mode that writes. Rewrites v0.1 constructs in place \u2014 `timestamp` to\n`generated: { by: process:okf-migrate, at }`, a `# Citations` list up into\n`sources`, `okf_version` to 0.2 \u2014 then validates. The rewrite is **textual**: a\nPyYAML round-trip would flatten comments, key order and quoting across the whole\nbundle. Each branch is guarded on the v0.2 key already existing, so a\nhalf-migrated bundle converges instead of growing a duplicate key. See the\n[migration decision](/decisions/okf-v02-dual-read.md) for what is deliberately\nnot recovered.\n\n# Output\n\n| Signal | Meaning |\n|--------|---------|\n| `ERROR` | Hard \u00a711 failure \u2014 bundle is non-conformant. |\n| `warn`  | Soft guidance (missing recommended field, broken link, legacy v0.1 field). |\n\nExit code is non-zero on any error, or when warnings exceed the gate: `--strict`\nallows none, `--max-warnings N` allows N, the default allows any. `--json` emits\nmachine-readable output for CI."}, {"id": "components/visualizer", "type": "Tool", "title": "okf_visualize.py", "description": "Standalone bundle\u2192viz.html renderer (Cytoscape + marked via CDN).", "tags": ["python", "visualization", "cytoscape"], "group": "components", "sz": 32, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-27T00:00:00Z"}, "verified": [], "sources": [], "body": "# Overview\n\nThe engine behind the [visualize skill](/skills/visualize.md). Parses a bundle\ninto nodes (concepts, coloured by `type`, sized by body length) and edges\n(markdown links, plus any `sources[].resource` that names another concept in the\nbundle), then emits one self-contained HTML file \u2014 no backend, nothing leaves the\npage. The detail panel renders the v0.2 trust, lifecycle, and provenance\nfrontmatter: `status`, `generated`, `verified`, `stale_after`, and a Sources list\ncarrying each source's credibility signals \u2014 a `usage_count` shown together with\nthe `usage_window` that frames it. A v0.1 `timestamp` is read as `generated.at`\nso legacy bundles still show a date.\n\n# Derived signals\n\nTwo things the panel infers rather than displays, because v0.2 defines them as\nderivations and storing them would be storing an opinion:\n\n* the **trust tier** (\u00a75.3) \u2014 no `verified` is *unverified*, `verified` by\n  non-`human:` actors only is *machine-confirmed*, any `human:` actor makes it\n  *human-reviewed*;\n* **staleness** (\u00a75.5) \u2014 a concept is stale when `today >= stale_after`, which\n  absolute dates reduce to a string comparison.\n\nBoth are advisory badges, not access control: nothing is hidden or refused on\ntheir account.\n\n# Flags\n\n| Flag | Effect |\n|------|--------|\n| `--title` / `--link` | Name the graph; show a back-link to source. |\n| `--layout` | Initial layout (`cose`, `breadthfirst`, `circle`, \u2026). |\n| `--og-image` | Emit Open Graph / Twitter Card meta for rich link previews. |\n\nAlso supports `?layout=` / `?select=` URL params and deep-linkable concepts\n(`viz.html#services/auth-api`)."}, {"id": "decisions/auto-release", "type": "Decision", "title": "Auto-release on version bump", "description": "A push to main that changes plugin.json's version tags and publishes a GitHub release, so releasing can't be forgotten.", "tags": ["adr", "ci", "release"], "group": "decisions", "sz": 29, "status": "stable", "stale_after": "", "generated": {"by": "agent:claude-opus-4-8", "at": "2026-08-03T10:00:36Z"}, "verified": [], "sources": [], "body": "# Context\n\nReleases were a manual `gh release create`, and it showed: versions 0.7.0 and\n0.7.1 were bumped in `.claude-plugin/plugin.json` but never tagged or released,\nso anyone pinned to a release tag never saw the dormant Stop hook that shipped in\nthem. A step a human has to remember is a step that eventually gets skipped.\n\n# Decision\n\nA [`release` workflow](/components/release-workflow.md)\n(`.github/workflows/release.yml`) runs on every push to `main` that touches\n`.claude-plugin/plugin.json`. It reads the version and, if no `okf--v\u003cversion>`\nrelease exists yet, creates the tag and a GitHub release with auto-generated\nnotes. It is idempotent: a version already released is a no-op.\n\n# Consequences\n\n* Bumping the version in `plugin.json` is the single trigger; the release follows\n  automatically, so it can no longer be forgotten.\n* Notes are auto-generated from merged PRs since the last release; a curated\n  title or body can still be edited on the release afterwards.\n* The floating `v1` tag that `action.yml` is consumed as\n  (`scaccogatto/okf-skills@v1`) is a separate major-version pointer, still moved\n  by hand on purpose."}, {"id": "decisions/dormant-hooks", "type": "Decision", "title": "Ship a dormant Stop hook \u2014 opt-in enforced upkeep", "description": "Supersede zero-hooks with a Stop hook that is a no-op unless the bundle opts in.", "tags": ["adr", "ux", "trust"], "group": "decisions", "sz": 31, "status": "stable", "stale_after": "", "generated": {"by": "agent:claude-fable-5", "at": "2026-08-02T11:39:43Z"}, "verified": [], "sources": [], "body": "# Context\n\nSoft-mode upkeep ([no hooks](/decisions/no-hooks.md)) depends entirely on a\nproject's `CLAUDE.md` carrying the pasted snippet \u2014 nothing enforces it, and\nadoption is invisible to the plugin. Users have asked for upkeep enforcement\nthat ships *with* the plugin rather than living outside it. The concerns\nbehind zero hooks are still valid for an always-ON hook: observing every\nsession is intrusive, and it risks failing third-party marketplace safety\nreview.\n\n# Decision\n\nShip one `Stop` hook, **dormant by default**: `hooks/okf-stop-check.sh` reads\none file and exits unless *both* hold \u2014\n\n1. the target repo's bundle opts in with `upkeep: enforced` in\n   `.okf/index.md` frontmatter, and\n2. the user has not opted out with `OKF_HOOK=off` in their environment.\n\nEnforcement is therefore a per-bundle, versioned declaration \u2014 checked into\nthe repo the bundle lives in \u2014 not a plugin-wide default. The\n[CLAUDE.md snippet](/decisions/no-hooks.md) remains the soft-mode path for\nbundles that never set `upkeep: enforced`.\n\n# Consequences\n\n* Passes the same safety review the [no-hooks decision](/decisions/no-hooks.md)\n  was written to pass: without the opt-in frontmatter, the hook is a single\n  file read and an exit, on every session, for every repo that doesn't ask for\n  it.\n* Enforcement becomes distributable with the plugin instead of copy-pasted\n  per project \u2014 see the [stop-hook component](/components/stop-hook.md).\n* [Ship no hooks](/decisions/no-hooks.md) is superseded by this decision."}, {"id": "decisions/dual-distribution", "type": "Decision", "title": "Dual distribution \u2014 plugin + skills.sh", "description": "Ship the same repo as a Claude Code plugin and as skills.sh-installable skills.", "tags": ["adr", "distribution"], "group": "decisions", "sz": 27, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-06-28T00:00:00Z"}, "verified": [], "sources": [], "body": "# Context\n\nOKF tooling is only useful where the agent already works. Claude Code users want a\nplugin; the broader agent ecosystem (Cursor, Codex, 20+ agents) installs via\nskills.sh.\n\n# Decision\n\nOne repo, both layouts: `.claude-plugin/` makes it a plugin marketplace;\n`skills/\u003cname>/SKILL.md` makes it skills.sh-discoverable. The\n[okf](/skills/okf.md), [validate](/skills/validate.md), and\n[visualize](/skills/visualize.md) skills are identical in either path.\n\n# Consequences\n\n* Maximum reach from a single source of truth.\n* Scripts must resolve their own path in both layouts \u2014 see the\n  [self-contained-skills decision](/decisions/self-contained-skills.md)."}, {"id": "decisions/no-hooks", "type": "Decision", "title": "Ship no hooks \u2014 soft-mode upkeep", "description": "Keep automatic consume/maintain opt-in via a CLAUDE.md snippet, not enforced hooks.", "tags": ["adr", "ux", "trust"], "group": "decisions", "sz": 27, "status": "deprecated", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-06-28T00:00:00Z"}, "verified": [], "sources": [], "body": "# Context\n\nAutomatic upkeep is valuable, but always-on hooks that observe arbitrary sessions\nare intrusive and fail third-party marketplace safety review.\n\n# Decision\n\nShip **zero hooks**. Adoption is opt-in: paste `templates/CLAUDE-okf.md` into a\nproject's `CLAUDE.md` to have Claude consult `.okf/` before tasks and write\nknowledge back after changes (the [okf skill](/skills/okf.md)'s maintain mode).\n\n# Consequences\n\n* No surprise behaviour; trivially passes marketplace safety gates.\n* Upkeep depends on the snippet being present \u2014 documented in the README.\n\nSuperseded by [dormant hooks \u2014 opt-in enforced upkeep](/decisions/dormant-hooks.md):\na `Stop` hook now ships with the plugin, but stays a no-op unless a bundle\nopts in with `upkeep: enforced`."}, {"id": "decisions/okf-v02-dual-read", "type": "Decision", "title": "Target OKF v0.2, migrate v0.1 rather than tolerate it", "description": "Author v0.2 everywhere; name the legacy constructs in warnings and ship the rewrite that clears them.", "tags": ["adr", "spec", "compatibility", "migration"], "group": "decisions", "sz": 36, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-27T00:00:00Z"}, "verified": [], "sources": [], "body": "# Context\n\n[OKF v0.2](/reference/okf-spec.md) supersedes v0.1 with two breaking renames \u2014\n`timestamp` becomes `generated.at`, and the body `# Citations` list becomes the\n`sources` frontmatter family (\u00a713.1). Bundles authored against v0.1 exist,\nincluding in repositories this toolkit does not control.\n\nCompatibility, however, was never at risk. \u00a711 has two hard rules \u2014 parseable\nYAML frontmatter and a non-empty `type` \u2014 and neither mentions `timestamp` or\n`# Citations`. A v0.1 bundle is conformant under v0.2 **with no code on our\nside**: same `conformant: true`, same warning count, same `--strict` outcome.\nWhat dedicated legacy branches buy is the wording of one warning, nothing more.\n\nThat reframes the real question. The upgrade hazard is not reading v0.1, it is\nthat [`templates/CLAUDE-okf.md`](/skills/okf.md) tells every user to run\n`--strict` before committing. Left alone, everyone holding a v0.1 bundle hits a\nhard failure on their next commit with no way out but a hand edit.\n\n# Decision\n\nKeep the legacy branches for their wording, and **ship the rewrite that clears\nthem**.\n\n* The [validator](/components/validator.md) reports a legacy `timestamp` or a\n  `# Citations` section as a **warning naming its v0.2 replacement** \u2014 never an\n  error. Eleven lines, kept because a warning that names the fix is worth more\n  than one that says a field is missing.\n* The [visualizer](/components/visualizer.md) falls back to `timestamp` when\n  `generated` is absent, so a v0.1 bundle still shows a date.\n* `--migrate` performs the rewrite textually \u2014 never a PyYAML round-trip, which\n  would flatten comments, key order and quoting across the whole bundle.\n* Everything that *writes* \u2014 [`okf_init.py`](/components/okf_init.md), the\n  [okf skill](/skills/okf.md)'s templates, and this repo's own bundles \u2014 emits\n  v0.2 only.\n\n# Consequences\n\n* An existing v0.1 bundle keeps working on day one, and `--migrate` is a single\n  command away from being strict-clean.\n* `--strict` still fails an unmigrated v0.1 bundle. That stays the nudge \u2014 it is\n  now a nudge with a door, not a wall.\n* `generated.by` cannot be reconstructed for content written before the field\n  existed. The migration writes `process:okf-migrate`, which is true and leaves\n  the concept correctly **unverified** under \u00a75.3 rather than faking review.\n* Per-claim attribution (the `[^id]` footnotes of \u00a75.1) is not recoverable from\n  a v0.1 `# Citations` list: the sources move up to frontmatter, but which claim\n  cited which source was never encoded. `--migrate` says so instead of guessing."}, {"id": "decisions/scale-guardrails", "type": "Decision", "title": "Scale guardrails in the visualizer", "description": "Default to a linear layout above 1k concepts, warn above 5k, batch and debounce filtering.", "tags": ["adr", "performance"], "group": "decisions", "sz": 31, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-14T00:00:00Z"}, "verified": [], "sources": [], "body": "# Context\n\nMeasured in Chrome against synthetic bundles, the default force (cose) layout\nblocked the page for ~32 s at ~2k concepts (its cost grows roughly quadratically\nwith node count \u2014 20k+ extrapolates to hours), while the linear layouts loaded\nthe same bundle in under 2 s. Independently of layout, a 23k-concept page took\n~27 s to load with ~650 MB of heap, and the unbatched per-keystroke filter pass\ncost ~1.8 s. Real bundles are curated and small, but nothing stopped the\n[visualizer](/components/visualizer.md) from generating a page that freezes the\nviewer's browser.\n\n# Decision\n\nKeep force as the default layout only up to 1,000 concepts and fall back to the\nlinear `concentric` layout above that; an explicit `--layout` (or `?layout=`)\nalways wins, and the in-page layout picker asks for confirmation before running\nforce on a large graph. Above 5,000 concepts, print a warning suggesting a\nsubtree render (the [visualize skill](/skills/visualize.md) accepts any\ndirectory). Wrap filter passes in `cy.batch()` and debounce the search box. A\nnew `--max-nodes` flag lets CI refuse oversized bundles outright.\n\n# Consequences\n\n* Small bundles render exactly as before; large bundles stay responsive instead\n  of freezing the tab.\n* The guardrails are defaults, not caps \u2014 force layout remains available at any\n  size for whoever explicitly asks.\n* Legibility past ~5k concepts is still poor by nature; subtree rendering is\n  the documented path, not something the tool tries to solve."}, {"id": "decisions/self-contained-skills", "type": "Decision", "title": "Self-contained skills via CLAUDE_SKILL_DIR", "description": "Each skill bundles its own script and references it through ${CLAUDE_SKILL_DIR}.", "tags": ["adr", "packaging"], "group": "decisions", "sz": 27, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-06-28T00:00:00Z"}, "verified": [], "sources": [], "body": "# Context\n\nThe [dual-distribution decision](/decisions/dual-distribution.md) means a script's\nlocation differs between the plugin layout and a standalone skills.sh install.\n\n# Decision\n\nEach skill ships its script inside its own directory and invokes it via\n`${CLAUDE_SKILL_DIR}`, which the runtime resolves in both layouts. The\n[validator](/components/validator.md) and [visualizer](/components/visualizer.md)\nare therefore always found alongside their skill.\n\n# Consequences\n\n* The [validate](/skills/validate.md) and [visualize](/skills/visualize.md) skills\n  work identically as a plugin or a standalone skill.\n* No absolute paths, no post-install configuration."}, {"id": "reference/okf-spec", "type": "Reference", "title": "OKF v0.2 specification", "description": "The Open Knowledge Format spec, vendored verbatim \u2014 the source of truth.", "tags": ["spec", "reference", "apache-2.0"], "group": "reference", "sz": 30, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-27T00:00:00Z"}, "verified": [], "sources": [{"title": "Open Knowledge Format reference repository", "resource": "https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf", "cid": null, "author": "team:google-cloud-data-cloud", "usage_count": null, "usage_window": "", "last_modified": "2026-07-27"}], "body": "# Overview\n\nThe canonical OKF v0.2 specification by the Google Cloud Data Cloud team\n(Apache-2.0), vendored verbatim at `skills/okf/reference/SPEC.md` (upstream\n`3fcbb9f`).[^okf-upstream] Every rule the [okf skill](/skills/okf.md) and\n[validator](/components/validator.md) apply traces here.\n\n# The one hard rule (\u00a711)\n\nA bundle is conformant iff every non-reserved `.md` file has parseable YAML\nfrontmatter and a non-empty `type`. Everything else is soft guidance; consumers\nMUST tolerate missing optional fields, unknown types, and broken links.\n\n# What v0.2 adds (\u00a713)\n\n| Family | Fields | Purpose |\n|--------|--------|---------|\n| Provenance | `sources[]` (`resource`, `id`, `author`, `usage_count`, `last_modified`), `usage_window` | Where a concept came from, with credibility signals. |\n| Trust | `generated: {by, at}`, `verified[]` | Who wrote it, who confirmed it. |\n| Lifecycle | `status`, `stale_after` | Is it current, is it still true. |\n| Attestation | `type: Attested Computation` + `runtime`, `parameters`, `computation`, `executor`, `attester` | Was this number produced the sanctioned way. |\n\nTwo v0.1 constructs are superseded: `timestamp` (now `generated.at`) and the\nbody `# Citations` list (now `sources`). This toolkit still reads both \u2014 see the\n[dual-read decision](/decisions/okf-v02-dual-read.md).\n\n[^okf-upstream]: Open Knowledge Format reference repository"}, {"id": "skills/okf", "type": "Skill", "title": "okf skill", "description": "Produce, maintain, and consume OKF bundles, driven by the verbatim v0.2 spec.", "tags": ["skill", "produce", "maintain", "consume"], "group": "skills", "sz": 31, "status": "stable", "stale_after": "", "generated": {"by": "human:scaccogatto", "at": "2026-07-27T00:00:00Z"}, "verified": [], "sources": [], "body": "# Overview\n\nThe authoring skill. It teaches Claude to derive concepts from code, docs, and\nhuman decisions; write conformant frontmatter; and cross-link concepts into a\ngraph \u2014 always against the [vendored OKF v0.2 spec](/reference/okf-spec.md), not\nmemory of it. It writes the v0.2 trust, lifecycle, and provenance families\n(`generated`, `verified`, `status`, `stale_after`, `sources`) and rewrites the two\nsuperseded v0.1 constructs when it meets them, per the\n[dual-read decision](/decisions/okf-v02-dual-read.md).\n\nFor a brand-new bundle, `produce` mode reaches for\n[`okf_init.py`](/components/okf_init.md) first: it scaffolds a conformant\n`index.md`, `log.md`, and a starter concept with full recommended frontmatter,\nso the bundl  try{if(decodeURIComponent((location.hash||'').slice(1))!==id)location.hash=encodeURIComponent(id);}catch(e){}}
cy.on('tap','node',e=>select(e.target.id()));
cy.on('tap',e=>{if(e.target===cy)cy.elements().removeClass('dim hl');});
function applyFilter(){const q=document.getElementById('search').value.toLowerCase();const ty=document.getElementById('type').value;
 cy.batch(()=>cy.nodes().forEach(n=>{const d=n.data();
  const m=(!q||(d.title+' '+d.type+' '+d.description+' '+(d.tags||[]).join(' ')).toLowerCase().includes(q))
        &&(!ty||d.type===ty)&&!off.has(d.type);
  n.style('display',m?'element':'none');}));}
let debounce;
document.getElementById('search').oninput=()=>{clearTimeout(debounce);debounce=setTimeout(applyFilter,150);};
document.getElementById('type').oninput=applyFilter;
const tysel=document.getElementById('type');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;tysel.appendChild(o);});
let curLayout='breadthfirst';
document.getElementById('layout').onchange=e=>{const v=e.target.value;
 if(v==='cose'&&NODES.length>1000&&!confirm(`force layout on ${NODES.length} concepts can freeze this tab — run anyway?`)){e.target.value=curLayout;return;}
 curLayout=v;cy.layout({name:v,animate:true,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();};
document.getElementById('legend').innerHTML=types.map(t=>`<span class="chip" data-t="${esc(t)}"><span class="dot" style="background:${color[t]}"></span>${esc(t)} (${NODES.filter(n=>n.type===t).length})</span>`).join('');
document.querySelectorAll('#legend .chip').forEach(ch=>ch.onclick=()=>{const t=ch.getAttribute('data-t');
 if(off.has(t)){off.delete(t);ch.classList.remove('off');}else{off.add(t);ch.classList.add('off');}applyFilter();});
document.getElementById('layout').value='breadthfirst';
const Q=new URLSearchParams(location.search),QL=Q.get('layout'),QS=Q.get('select');
if(QL&&[...document.querySelectorAll('#layout option')].some(o=>o.value===QL)){document.getElementById('layout').value=QL;curLayout=QL;cy.layout({name:QL,animate:false,padding:40,nodeRepulsion:9000,idealEdgeLength:90}).run();}
function fromHash(){try{const h=decodeURIComponent((location.hash||'').slice(1));if(h&&byId[h])select(h);}catch(e){}}
addEventListener('hashchange',fromHash);
